name: Backend CI

on:
  push: {}
  pull_request: {}

jobs:
  test-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: converter-backend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'converter-backend/package.json'

      - name: Instalar dependências
        run: npm install

      - name: Rodar testes do backend (Jasmine)
        run: npm test
